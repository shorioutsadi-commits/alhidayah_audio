name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build

      - name: Verify dist files
        run: |
          echo "=== Verifying dist directory contents ==="
          ls -la dist
          test -f dist/index.html || { echo "ERROR: dist/index.html is missing!"; exit 1; }
          test -f dist/manifest.json || { echo "ERROR: dist/manifest.json is missing!"; exit 1; }
          test -f dist/icon.svg || { echo "ERROR: dist/icon.svg is missing!"; exit 1; }
          test -d dist/assets || { echo "ERROR: dist/assets directory is missing!"; exit 1; }
          touch dist/.nojekyll
          echo "=== dist verification passed successfully ==="

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
